<!DOCTYPE html>
<html>
<head>
<title>SBP Watala - Certificate</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body,html{width:100%;height:100%;overflow:hidden;background:#000}
iframe{width:100%;height:100%;border:none}
#blocker{position:fixed;top:0;right:0;width:60px;height:50px;z-index:999;background:transparent}
</style>
</head>
<body oncontextmenu="return false">

<iframe id="pdf" src=""></iframe>
<div id="blocker"></div>

<script>
let id = new URLSearchParams(location.search).get('id');
if(!id){
  document.body.innerHTML = "<h2 style='color:white;text-align:center;padding-top:50px'>Invalid Certificate</h2>";
} else {
  // SCSA jaisa hi - toolbar, download, print sab band
  document.getElementById('pdf').src = '../certificates/' + id + '.pdf#toolbar=0&navpanes=0&scrollbar=0&view=FitH';
}

// Right click band
document.addEventListener('contextmenu', e => e.preventDefault());

// Print band - Ctrl+P, Ctrl+S, Ctrl+C
document.addEventListener('keydown', function(e){
  if((e.ctrlKey || e.metaKey) && ['p','s','c','u'].includes(e.key.toLowerCase())){
    e.preventDefault();
    alert('Print / Download not allowed');
  }
});
</script>
</body>
</html>
